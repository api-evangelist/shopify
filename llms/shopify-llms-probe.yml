# Negative + positive probe record for llms.txt. Both are recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file makes repo_has?(slug,'llms') true so the
# unprobed-pointer fallback stops firing, and now also records the location where
# the document ACTUALLY lives, which is not where apis.yml pointed.
llms:
  probed: '2026-08-27'
  published: true
  file: llms/shopify-llms.txt
  probes:
  - url: https://www.shopify.com/llms.txt
    status: 200
    verdict: served
    content_type: text/plain; charset=utf-8
    bytes: 12520
    detail: >-
      Real llms.txt, 12.5KB, hand-curated across 12 sections (Start a Business, Build with AI, Sell
      Online, Payments and Money, Manage your Store, Grow your Business, Plans, For Developers, Free
      Business Tools, Need help?). Signed at the foot: "This file is maintained by an internal bot
      named Bytophage." Every link checked in this pass resolved.
  - url: https://shopify.dev/llms.txt
    status: 404
    verdict: absent
    detail: >-
      The docs host does NOT serve llms.txt, despite apis.yml having carried a LlmsText pointer at
      this exact URL. The pointer was confirmed dead in this pass and repointed at
      https://www.shopify.com/llms.txt.
  - url: https://shopify.dev/docs/llms.txt
    status: 404
    verdict: absent
  note: >-
    shopify.dev compensates for having no llms.txt with something arguably better and definitely
    rarer: EVERY documentation page is served as markdown by appending `.md` to its URL, and the
    404 page says so in plain text. https://shopify.dev/docs.md is the markdown documentation index
    and https://shopify.dev/sitemap.xml enumerates every published URL. Every doc cited across this
    repo's artifacts was read through that markdown twin.
