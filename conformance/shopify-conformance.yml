  source: https://shopify.dev/docs/api/usage/limits#identifying-bots-with-web-bot-auth
  note: >-
    This is a rare thing to find in this catalog — a provider that has priced agent traffic into its
    rate limiter and published the identity mechanism that buys a better tier.
domain_standard:
  id: ucp
  name: Universal Commerce Protocol (UCP)
  version: '2026-04-08'
  conforms: true
  spec: https://ucp.dev
  declared_in_contract: true
  evidence: >-
    Declared by the contract itself, not by a marketing page. https://catalog.shopify.com/.well-known/ucp
    returns HTTP 200 with a UCP service descriptor naming service dev.ucp.shopping over transport mcp
    at endpoint https://catalog.shopify.com/api/ucp/mcp, and enumerating the capabilities
    dev.ucp.shopping.catalog.search, dev.ucp.shopping.catalog.lookup, dev.shopify.catalog.global and
    dev.ucp.common.identity_linking, each with its spec URL and JSON Schema. The live tools/list on
    that endpoint returns tool descriptions that name their UCP capability inline
    ("Input and response conform to the UCP catalog search capability (dev.ucp.shopping.catalog.search)").
  capabilities:
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.shopify.catalog.global
  - dev.ucp.common.identity_linking
  merchant_surface_capabilities:
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.order
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.buyer_consent
  buyer_impact: >-
    An agent that already speaks UCP can search Shopify's global catalog, build a cart, create a
    checkout and track an order with no Shopify-specific connector. An agent that does not needs a
    bilateral integration per platform. Shopify also publishes the spec at ucp.dev rather than
    keeping it proprietary, so the standard is portable off Shopify.
  artifacts:
  - well-known/shopify-catalog-ucp.json
  - mcp/shopify-catalog-mcp-tools.json
  - mcp/shopify-mcp.yml
