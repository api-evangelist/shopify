  - shopify
  - activecampaign
  steps:
  - step: list-new-customers
    repo: shopify
    spec_file: shopify-customers-api-openapi.yml
    operationId: listCustomers
    tag: Customers
    capability_id: BC-420.10
    capability: Customer Data Management
    capability_l1: BC-420
    intent: List customers
    effect: read
    unmapped: null
  - step: create-contact
    repo: activecampaign
    spec_file: activecampaign-contacts-api-openapi.yml
    operationId: create-a-new-contact
    tag: Contacts
    capability_id: null
    capability: null
    capability_l1: null
    intent: Create a new contact
    effect: write
    unmapped: no capability edge for this spec file
  connects:
    shopify:
      capabilities:
      - BC-420.10
      tags:
      - Customers
    activecampaign:
      capabilities: []
      tags:
      - Contacts
  intents:
  - List customers
  - Create a new contact
