arazzo: 1.0.1
info:
  title: Shopify paid orders to Google Sheets rows
  summary: Shopify paid orders to Google Sheets rows, recreated from the Zapier template
    as Arazzo.
  description: Recreates the Zapier template "Shopify paid orders to Google Sheets
    rows" as a forkable Arazzo workflow over the Shopify Admin REST contract and the
    google-sheets contract held in the API Evangelist catalog.
  version: 1.0.0
sourceDescriptions:
- name: shopifyOrders
  url: https://raw.githubusercontent.com/api-evangelist/shopify/refs/heads/main/openapi/shopify-orders-api-openapi.yml
  type: openapi
- name: googleSheetsValues
  url: https://raw.githubusercontent.com/api-evangelist/google-sheets/refs/heads/main/openapi/google-sheets-values-api-openapi.yml
  type: openapi
workflows:
- workflowId: paid-orders-to-rows
  summary: Shopify paid orders to Google Sheets rows
  inputs:
    type: object
    properties:
      since:
        type: string
        format: date-time
        description: Only consider records created at or after this time.
      spreadsheetId:
        type: string
      range:
        type: string
  steps:
  - stepId: list-paid-orders
    description: List recent Shopify orders filtered to financial_status=paid.
    operationId: $sourceDescriptions.shopifyOrders.listOrders
    parameters:
    - name: financial_status
      in: query
      value: paid
    - name: created_at_min
      in: query
      value: $inputs.since
    - name: limit
      in: query
      value: 50
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      orders: $response.body#/orders
      firstOrderName: $response.body#/orders/0/name
      firstOrderTotal: $response.body#/orders/0/total_price
      firstOrderEmail: $response.body#/orders/0/email
  - stepId: append-order-row
    description: Append the order as a row to the spreadsheet range.
    operationId: $sourceDescriptions.googleSheetsValues.appendValues
    parameters:
    - name: spreadsheetId
      in: path
      value: $inputs.spreadsheetId
    - name: range
      in: path
      value: $inputs.range
    - name: valueInputOption
      in: query
      value: USER_ENTERED
    requestBody:
      contentType: application/json
      payload:
        values:
        - - $steps.list-paid-orders.outputs.firstOrderName
          - $steps.list-paid-orders.outputs.firstOrderEmail
          - $steps.list-paid-orders.outputs.firstOrderTotal
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      updatedRange: $response.body#/updates/updatedRange
  outputs:
    updatedRange: $steps.append-order-row.outputs.updatedRange
x-integration:
  partner: google-sheets
  template: https://zapier.com/apps/google-sheets/integrations/shopify/2758/add-new-paid-shopify-orders-to-google-sheets-rows
  edge_evidence: https://zapier.com/apps/google-sheets/integrations/shopify/2758/add-new-paid-shopify-orders-to-google-sheets-rows
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: enrich local-v5 (provider-integrations-arazzo)
  guessed_steps:
  - step: list-paid-orders
    cause: provider-contract
    why: Zapier triggers on each new paid order (a webhook); the REST contract offers
      only a polled list, so the workflow polls and maps the first order.
