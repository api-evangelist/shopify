description: Shopify is a complete commerce platform that lets you start, grow, and manage a business,
  selling online, in person, on marketplaces, through social channels, and now inside AI chats. Its developer
  platform exposes GraphQL Admin, Storefront and Customer Account APIs, a legacy Admin REST surface, 206
  webhook topics, Shopify Functions, Hydrogen and the Shopify CLI, so apps and integrations can extend
  Shopify for merchants and buyers alike. Shopify also runs four MCP servers bound to the Universal Commerce
  Protocol, letting AI agents search a cross-merchant catalog, build carts, complete checkouts and track
  orders.
