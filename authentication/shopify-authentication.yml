provider: Shopify
providerId: shopify
summary:
  types:
  - apiKey
  - oauth2
  - openIdConnect
  api_key_in:
  - header
  versioned: false
  versioning_note: >-
    The OAuth endpoints — including AccessScope — are explicitly listed as UNVERSIONED. They can
