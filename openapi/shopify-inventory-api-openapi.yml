      parameters:
      - in: query
        name: "ids\n                  required"
        description: "Show only inventory items specified by a comma-separated list of IDs.\n                  (maximum: 100)"
        schema: {}
        required: false
      - in: query
        name: limit
        description: "The maximum number of results to show.\n                  (default: 50, maximum: 250)"
        schema: {}
        required: false
      - in: query
        name: ids
        schema:
          type: integer
        description: ids
        required: false
