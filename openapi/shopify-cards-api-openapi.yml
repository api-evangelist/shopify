info:
  title: Shopify Cards API
  description: Explore Shopify's API reference and templating documentation. Shopify provides a range of software tools, app templates, example apps, and libraries to accelerate your development process. The Admin API lets you build apps and integrations that extend and enhance the Shopify admin.
  version: 2020-10
tags:
- name: Cards
paths:
  /admin/api/2020-01/gift_cards.json:
    get:
      summary: Shopify Retrieves A List Of Gift Cards
      description: https://shopify.dev/docs/admin-api/rest/reference/plus/giftcard#index-2020-01
      parameters:
      - in: query
        name: status
        description: "Retrieve gift cards with a given status. Valid values:\n                    \n                        enabled: Restrict results to only enabled gift cards\n                        disabled: Restrict results to only disabled gift cards"
        schema: {}
        required: false
      - in: query
        name: limit
        description: "The maximum number of results to show.\n                  (default: 50, maximum: 250)"
        schema: {}
        required: false
      - in: query
        name: since_id
        description: Restrict results to after the specified ID.
        schema: {}
        required: false
      - in: query
        name: fields
        description: Show only certain fields, specified by a comma-separated list of field names.
        schema: {}
        required: false
      tags:
      - Cards
      responses:
        '200':
          description: ''
      operationId: deprecated_202001_get_gift_cards
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
