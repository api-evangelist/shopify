openapi: 3.2.0
info:
  title: Shopify Customer API
  description: Explore Shopify's API reference and templating documentation. Shopify provides a range of software tools, app templates, example apps, and libraries to accelerate your development process. The Admin API lets you build apps and integrations that extend and enhance the Shopify admin.
  version: 2020-10
tags:
- name: Customer
paths:
  /admin/api/2020-01/customers.json:
    post:
      requestBody:
        content:
          application/json:
            schema: {}
            examples:
              example1:
                value:
                  customer:
                    first_name: Steve
                    last_name: Lastnameson
                    email: steve.lastnameson@example.com
                    phone: '+15142546011'
                    verified_email: true
                    addresses:
                    - address1: 123 Oak St
                      city: Ottawa
                      province: 'ON'
                      phone: 555-1212
                      zip: 123 ABC
                      last_name: Lastnameson
                      first_name: Mother
                      country: CA
                summary: Create a new customer record
              example2:
                value:
                  customer:
                    email: null
                    first_name: null
                    last_name: null
                summary: Creating a customer without an email or name fails and returns an error
              example3:
                value:
                  customer:
                    first_name: Steve
                    last_name: Lastnameson
                    email: steve.lastnameson@example.com
                    phone: '+15142546011'
                    verified_email: true
                    addresses:
                    - address1: 123 Oak St
                      city: Ottawa
                      province: 'ON'
                      phone: 555-1212
                      zip: 123 ABC
                      last_name: Lastnameson
                      first_name: Mother
                      country: CA
                    metafields:
                    - key: new
                      value: newvalue
                      value_type: string
                      namespace: global
                summary: Create a customer with a metafield
              example4:
                value:
                  customer:
                    first_name: Steve
                    last_name: Lastnameson
                    email: steve.lastnameson@example.com
                    phone: '+15142546011'
                    verified_email: true
                    addresses:
                    - address1: 123 Oak St
                      city: Ottawa
                      province: 'ON'
                      phone: 555-1212
                      zip: 123 ABC
                      last_name: Lastnameson
                      first_name: Mother
                      country: CA
                    send_email_invite: true
                summary: Create a customer with send_email_invite
              example5:
                value:
                  customer:
                    first_name: Steve
                    last_name: Lastnameson
                    email: steve.lastnameson@example.com
                    phone: '+15142546011'
                    verified_email: true
                    addresses:
                    - address1: 123 Oak St
                      city: Ottawa
                      province: 'ON'
                      phone: 555-1212
                      zip: 123 ABC
                      last_name: Lastnameson
                      first_name: Mother
                      country: CA
                    password: newpass
                    password_confirmation: newpass
                    send_email_welcome: false
                summary: Create a customer with password and password_confirmation and skip sending the welcome email
      summary: Shopify Creates A Customer
      description: https://shopify.dev/docs/admin-api/rest/reference/customers/customer#create-2020-01
      parameters: []
      tags:
      - Customer
      responses:
        '200':
          description: ''
      operationId: deprecated_202001_create_customers
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
  /admin/api/2020-01/customers/{customer_id}.json:
    get:
      summary: Shopify Retrieves A Single Customer
      description: https://shopify.dev/docs/admin-api/rest/reference/customers/customer#show-2020-01
      parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          type: string
        description: customer_id
      - in: query
        name: fields
        description: Show only certain fields, specified by a comma-separated list of field names.
        schema: {}
        required: false
      tags:
      - Customer
      responses:
        '200':
          description: ''
      operationId: deprecated_202001_get_customers_param_customer_id
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
    put:
      requestBody:
        content:
          application/json:
            schema: {}
            examples:
              example1:
                value:
                  customer:
                    id: 207119551
                    email: changed@email.address.com
                    note: Customer is a great guy
                summary: Update details for a customer
              example2:
                value:
                  customer:
                    id: 207119551
                    metafields:
                    - key: new
                      value: newvalue
                      value_type: string
                      namespace: global
                summary: Add metafield to an existing customer
              example3:
                value:
                  customer:
                    id: 207119551
                    tags: New Customer, Repeat Customer
                summary: Update a customer's tags
              example4:
                value:
                  customer:
                    id: 207119551
                    accepts_marketing: true
                    accepts_marketing_updated_at: '2020-11-01T16:46:41-05:00'
                    marketing_opt_in_level: confirmed_opt_in
                summary: Update a customer's marketing opt-in state
      summary: Shopify Updates A Customer
