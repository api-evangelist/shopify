openapi: 3.2.0
info:
  title: Shopify Admin REST Shop API
  description: The Shopify Admin REST API lets you build apps and integrations that extend and enhance the Shopify admin. Access products, customers, orders, inventory, fulfillment, and more. Endpoints are organized by resource type and versioned by release date.
  version: 2025-01
  contact:
    name: Shopify
    url: https://shopify.dev/docs/api/admin-rest
    email: api@shopify.com
  license:
    name: Shopify API Terms
    url: https://www.shopify.com/legal/api-terms
  x-date: '2026-03-04'
servers:
- url: https://{store}.myshopify.com/admin/api/2025-01
  description: Shopify Admin REST API
  variables:
    store:
      default: my-store
      description: The Shopify store subdomain
security:
- AccessToken: []
tags:
- name: Shop
  description: Retrieve shop configuration
paths:
  /shop.json:
    get:
      operationId: getShop
      summary: Shopify Retrieve shop configuration
      description: Retrieves the shop's configuration including name, domain, currency, timezone, plan, and address information.
      tags:
      - Shop
      parameters:
      - name: fields
        in: query
        description: Comma-separated list of fields to include
        schema:
          type: string
      responses:
        '200':
          description: The shop configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    $ref: '#/components/schemas/Shop'
components:
  schemas:
    Shop:
      type: object
      description: Shop configuration and metadata
      properties:
        id:
          type: integer
        name:
          type: string
          description: The name of the shop
        email:
          type: string
          format: email
        domain:
          type: string
          description: Primary domain
        myshopify_domain:
          type: string
          description: The .myshopify.com domain
        shop_owner:
          type: string
        phone:
          type:
          - string
          - 'null'
        address1:
          type: string
        address2:
          type:
          - string
          - 'null'
        city:
          type: string
        province:
          type: string
        province_code:
          type: string
        country:
          type: string
        country_code:
          type: string
        country_name:
          type: string
        zip:
          type: string
        currency:
          type: string
          description: Three-letter ISO 4217 currency code
        money_format:
          type: string
        timezone:
          type: string
        iana_timezone:
          type: string
        plan_name:
          type: string
        plan_display_name:
          type: string
        weight_unit:
          type: string
        primary_locale:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        admin_graphql_api_id:
          type: string
  securitySchemes:
    AccessToken:
      type: apiKey
      name: X-Shopify-Access-Token
      in: header
      description: Access token obtained via OAuth
