rest_only:
  note: >-
    The Admin surface is almost entirely untooled. Every merchant-side operation below exists in the
    OpenAPI and has no MCP tool on any Shopify server — which is the correct design (these are
    merchant actions, not buyer actions) but it means an agent acting FOR a merchant, rather than for
    a shopper, still has to speak REST or GraphQL Admin.
