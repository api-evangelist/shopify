provider: Shopify
providerId: shopify
note: >-
  Shopify's MCP tools are buyer-facing and coarse; the REST/GraphQL surface is merchant-facing and
  fine-grained. The two are NOT two skins on one backend, which is the central finding here — most
  MCP tools are composites with no single backing operation, and almost the entire Admin surface has
  no tool at all. Confidence is set by whether the tool's documented arguments map cleanly onto a
  named operation, not by name similarity.
