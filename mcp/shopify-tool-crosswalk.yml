crosswalk:
- tool: search_catalog
  category: discovery
  rest: []
  graphql: [QueryRoot.search, QueryRoot.products]
  binding: composite
  confidence: medium
  note: >-
    Free-text search with buyer context, filters and cursor pagination. The Storefront GraphQL
    `search` and `products` connections cover the query and pagination halves; the buyer `context`
    (country, language, currency, intent) and cross-merchant fan-out have no REST or single-store
    GraphQL equivalent. No Admin REST operation backs this.
- tool: lookup_catalog
  category: discovery
  rest: [getProduct]
  graphql: [QueryRoot.nodes]
  binding: partial
  confidence: medium
  note: >-
    Batch id resolution (up to 10 gids). getProduct resolves one product by numeric id on Admin REST;
    the tool takes global ids across products AND variants and applies post-resolution filters, so it
    is a fan-out over that operation rather than a rename of it.
- tool: get_product
  category: discovery
  rest: [getProduct, listProductVariants, listProductImages]
  graphql: [QueryRoot.product]
  binding: composite
  confidence: high
  note: >-
    Full product detail with interactive variant narrowing. The `selected` / `preferences` option-
    relaxation behaviour is server-side logic that no REST operation exposes; the underlying data is
    the union of the three listed operations.
- tool: search_shop_policies_and_faqs
  category: content
  rest: []
  graphql: [QueryRoot.shop]
  binding: none
  confidence: low
  note: >-
    Retrieval over indexed policy and FAQ content. Shop.shippingPolicy / refundPolicy / privacyPolicy
    are the closest published fields, but the tool answers a natural-language question against an
    index rather than returning a policy document. Treated as mcp-only in the coverage count.
- tool: get_cart
  category: cart
  rest: [getCart]
  graphql: [QueryRoot.cart]
  binding: direct
  confidence: high
  note: >-
    The Ajax API getCart (GET /cart.js) is the same read on the theme surface. The MCP tool is
    addressed by cart_id rather than by session cookie, which is the substantive difference.
- tool: update_cart
  category: cart
  rest: [addToCart, updateCart, changeCartItem, clearCart]
  graphql: [Mutation.cartLinesAdd, Mutation.cartLinesUpdate, Mutation.cartLinesRemove]
  binding: composite
  confidence: high
  note: >-
    One tool absorbs four Ajax operations and three GraphQL mutations. quantity 0 means remove, which
    is how clearCart and cartLinesRemove are reached; a missing cart_id means create, which is how
    cartCreate is reached.
- tool: create_cart
  category: cart
  rest: []
  graphql: [Mutation.cartCreate]
  binding: direct
  confidence: high
- tool: cancel_cart
  category: cart
  rest: [clearCart]
  graphql: []
  binding: partial
  confidence: low
  note: >-
    UCP cart cancellation. clearCart empties a theme cart; it does not cancel a UCP cart resource.
    Requires meta["idempotency-key"]. Mapped at low confidence deliberately.
