custom_data:
  mechanism: Metafields and Metaobjects
  docs: https://shopify.dev/docs/apps/build/custom-data
  detail: >-
    Metafields attach typed custom values to built-in entities (Product, Customer, Order, Shop and
    others). Metaobjects define entirely new entity types. Both carry definitions, so the extension
    surface is schema'd rather than free-form — an important difference from a generic metadata bag.
