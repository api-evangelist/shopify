note: >-
  Two identifier systems coexist and confusing them is the most common integration mistake on this
  platform. Admin REST returns numeric ids AND an admin_graphql_api_id on nearly every object; the
  GraphQL APIs and every MCP tool use only the GID form. The admin_graphql_api_id field is the
  documented bridge between them, which is why it is recorded on every entity below rather than
  dismissed as noise.
identifiers:
- scheme: numeric id
  surfaces: [Admin REST API, Ajax API]
  example: 11235813213455
- scheme: 'GID (Shopify Global ID)'
  format: 'gid://shopify/{Type}/{numeric-id}'
  surfaces: [GraphQL Admin API, Storefront API, Customer Account API, all UCP MCP tools]
  examples:
  - gid://shopify/Product/123
  - gid://shopify/ProductVariant/456
  - gid://shopify/Cart/abc123def456
  - gid://shopify/CartLine/line2
  - gid://shopify/Checkout/abc123
  - gid://shopify/AppSubscription/1029266968
  - gid://shopify/Shop/548380009
- scheme: handle
  surfaces: [Ajax API, Storefront API, Liquid]
  detail: URL-safe slug used to address products, collections, blogs and pages by name.
  example: '/products/{handle}.js'
bridge_field:
  name: admin_graphql_api_id
  present_on: [Product, Variant, Image, Customer, Order, LineItem, Fulfillment, InventoryItem, InventoryLevel, Location, Collection, Webhook, Shop, Refund]
  detail: The GID for a REST object, returned alongside its numeric id. The only in-band way to cross surfaces.
