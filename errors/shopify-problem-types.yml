informational_codes:
- status: 200
  title: OK
  description: The request was successfully processed by Shopify.
- status: 201
  title: Created
  description: The request has been fulfilled and a new resource has been created.
- status: 202
  title: Accepted
  description: The request has been accepted, but not yet processed.
- status: 204
  title: No Content
  description: The request has been accepted, but no content will be returned. For example, a client might use an
    update operation to save a document temporarily, and not refresh to a new page.
- status: 205
  title: Reset Content
  description: The request has been accepted, but no content will be returned. The client must reset the document
    from which the original request was sent. For example, if a user fills out a form and submits it, then the 205
    code means that the server is making a request to the browser to clear the form.
- status: 303
  title: See Other
  description: The response to the request can be found under a different URL in the `Location` header and can be
    retrieved using a GET method on that resource.
