deprecation:
  policy_published: true
  policy_url: https://shopify.dev/docs/api/usage/versioning#deprecation-practices
  process: >-
    A deprecated field or type is deprecated across ALL supported stable versions at once and removed
    in a subsequent release — deprecate in 2026-10, remove in 2027-01. The nine-month version overlap
    is the guaranteed migration runway.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Shopify does NOT emit RFC 8594 Sunset/Deprecation response headers. Deprecation is signalled
    out-of-band instead, through five channels listed below. For an agent this matters: there is no
    runtime header to read, so deprecation awareness has to come from the API health report or the
    changelog, not from the response.
  channels:
  - name: API health report
    url: https://shopify.dev/docs/api/usage/versioning/api-health
    detail: Lists the resources an app uses that require changes.
  - name: GraphiQL Explorer warnings
    url: https://shopify.dev/docs/api/usage/api-exploration/admin-graphiql-explorer
  - name: Developer changelog
    url: https://shopify.dev/changelog
  - name: API reference annotations
    detail: Deprecated fields are marked with their replacement in the reference.
  - name: Emergency developer contact
    detail: Direct notification for imminent backwards-incompatible changes.
  enforcement: >-
    An app still calling unsupported resources after the upgrade deadline is DELISTED from the
    Shopify App Store, installs are blocked for at least seven days, and merchants see warnings in
    the admin until seven days after the last detected use. Shopify enforces its deprecation policy
    commercially, not just editorially.
  active_deprecations:
  - item: Online store script tags
    announced: '2026-08-24'
    stops_working: '2027-03-01'
    surfaces: [Admin GraphQL API, Admin REST API]
    url: https://shopify.dev/changelog/online-store-script-tags-deprecation
    severity: action-required
  - item: Non-expiring offline access tokens for the Admin API
    effective: '2027-01-01'
    detail: >-
      From 2027-01-01 an Admin API request presenting a public app's non-expiring offline access
      token returns 403 with "Non-expiring access tokens are no longer accepted for the Admin API".
    url: https://shopify.dev/docs/apps/build/authentication-authorization/migrate-to-expiring-offline-access-tokens
    severity: action-required
  surface_level:
  - surface: Admin REST API
    status: legacy
    evidence: >-
      Not listed among versioned APIs in the current versioning reference, while the GraphQL Admin,
      Storefront, Customer Account, Function, Partner, Payments Apps and Webhooks APIs all are.
      Shopify's own guidance in apis.yml says GraphQL is the recommended API for all new development.
