versioning:
  scheme: date-based quarterly
  format: YYYY-MM
  current_stable: '2026-07'
  release_cadence: every three months, at the start of the quarter, 17:00 UTC
  location: in the request URL
  channels:
  - name: stable
    detail: Production. Guaranteed not to change for its supported lifetime.
  - name: release candidate
    detail: Published on the same date as the stable release. May contain backwards-incompatible changes.
  - name: unstable
    detail: Continuously updated with in-progress changes; no release guarantee.
  support_window:
    minimum_months: 12
    overlap_months: 9
  fall_forward:
    enabled: true
    detail: >-
      A request targeting an inaccessible version is served by the oldest accessible stable version
      rather than failing. The X-Shopify-API-Version response header reports which version actually
      answered — that mismatch is the runtime signal that an app is out of date.
  unversioned_surfaces:
  - Ajax API
  - App Home
  - Catalog API
  - Customer Privacy API
  - Liquid
  - OAuth endpoints (including AccessScope)
  - Shop Minis
  - Shop Pay Wallet
  - Storefront Web Components
  - Web Pixels API
  unversioned_note: >-
    These may change at any time with no deprecation window. Notably that includes the OAuth
    endpoints every other API depends on, and the Storefront Web Components an agent might embed.
